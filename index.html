<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeSpace Scan</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 0; padding: 12px; }
  #wrap { position: relative; display: inline-block; width: 100%; max-width: 480px; }
  video { width: 100%; display: block; }
  #overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  button { font-size: 16px; padding: 10px 18px; margin: 8px; }
  .tip { font-size: 14px; color: #555; }
</style>
</head>
<body>
<h2>SafeSpace Scan</h2>
<p class="tip">Dim the room, then sweep slowly with your phone torch on.</p>
<button onclick="startCamera()">Start scan</button>
<div id="wrap">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>
<p id="status">Press Start scan</p>
<label>Sensitivity: <input id="thr" type="range" min="200" max="255" value="248"></label>
<canvas id="work" style="display:none"></canvas>

<script>
const video = document.getElementById('cam');
const overlay = document.getElementById('overlay');
const work = document.getElementById('work');
const status = document.getElementById('status');
const W = 160, H = 120;
const RING_MAX = 120;   // surroundings must be darker than this
const MIN_FRAMES = 4;   // spot must persist this many frames
work.width = W; work.height = H;
const wctx = work.getContext('2d', { willReadFrequently: true });
const octx = overlay.getContext('2d');
let hits = {};

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    await video.play();
    requestAnimationFrame(scan);
  } catch (e) {
    status.textContent = 'Camera error: ' + e.message;
  }
}

function carry(gx, gy) {
  let m = 0;
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      m = Math.max(m, hits[(gx + dx) + ',' + (gy + dy)] || 0);
  return m;
}

function scan() {
  if (video.videoWidth) {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    wctx.drawImage(video, 0, 0, W, H);
    const d = wctx.getImageData(0, 0, W, H).data;
    const thr = Number(document.getElementById('thr').value);
    const lum = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) {
      lum[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
    }
    const seen = new Uint8Array(W * H);
    const cands = [];

    for (let i = 0; i < W * H; i++) {
      if (lum[i] <= thr || seen[i]) continue;
      const stack = [i];
      seen[i] = 1;
      let n = 0, minX = W, maxX = 0, minY = H, maxY = 0, peak = 0;
      while (stack.length) {
        const p = stack.pop();
        n++;
        const x = p % W, y = (p - x) / W;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (lum[p] > peak) peak = lum[p];
        const nb = [];
        if (x > 0) nb.push(p - 1);
        if (x < W - 1) nb.push(p + 1);
        if (y > 0) nb.push(p - W);
        if (y < H - 1) nb.push(p + W);
        for (const q of nb) {
          if (lum[q] > thr && !seen[q]) { seen[q] = 1; stack.push(q); }
        }
      }
      const bw = maxX - minX + 1, bh = maxY - minY + 1;
      const roundish = Math.abs(bw - bh) <= Math.max(bw, bh) * 0.5;
      const filled = n / (bw * bh) > 0.5;
      if (n < 3 || n > 40 || !roundish || !filled) continue;

      // check the surroundings are dark
      let sum = 0, cnt = 0;
      const x0 = Math.max(0, minX - 4), x1 = Math.min(W - 1, maxX + 4);
      const y0 = Math.max(0, minY - 4), y1 = Math.min(H - 1, maxY + 4);
      for (let x = x0; x <= x1; x++) {
        sum += lum[y0 * W + x] + lum[y1 * W + x]; cnt += 2;
      }
      for (let y = y0; y <= y1; y++) {
        sum += lum[y * W + x0] + lum[y * W + x1]; cnt += 2;
      }
      if (sum / cnt > RING_MAX) continue;

      cands.push({ cx: (minX + maxX + 1) / 2, cy: (minY + maxY + 1) / 2, r: Math.max(bw, bh) / 2, peak });
    }

    cands.sort((a, b) => b.peak - a.peak);
    const top = cands.slice(0, 3);
    const newHits = {};
    octx.clearRect(0, 0, overlay.width, overlay.height);
    octx.strokeStyle = 'red';
    octx.lineWidth = 3;
    const sx = overlay.width / W, sy = overlay.height / H;
    let found = 0;
    for (const c of top) {
      const gx = Math.floor(c.cx / 6), gy = Math.floor(c.cy / 6);
      const key = gx + ',' + gy;
      newHits[key] = carry(gx, gy) + 1;
      if (newHits[key] >= MIN_FRAMES) {
        found++;
        octx.beginPath();
        octx.arc(c.cx * sx, c.cy * sy, c.r * sx + 14, 0, Math.PI * 2);
        octx.stroke();
      }
    }
    hits = newHits;
    status.textContent = found
      ? 'Possible lens spots: ' + found + ' (please check by eye)'
      : 'Nothing suspicious seen';
  }
  requestAnimationFrame(scan);
}
</script>
</body>
</html>
