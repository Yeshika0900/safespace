<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeSpace Report</title>
<style>
  body { font-family: sans-serif; padding: 14px; max-width: 560px; margin: auto; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, textarea, button { font-size: 16px; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; }
  button { width: auto; margin: 12px 8px 0 0; }
  #out { white-space: pre-wrap; background: #f7f7f7; padding: 14px; margin-top: 16px; line-height: 1.5; }
  .help { background: #f2f2f2; padding: 10px; margin-top: 16px; }
  @media print { .controls, .help { display: none; } #out { background: white; } }
</style>
</head>
<body>
<h2>SafeSpace Report</h2>
<div class="controls">
  <label>Where did this happen? (hotel, PG, shop name and city)</label>
  <input id="place" placeholder="e.g. Hotel Sunrise, Noida">

  <label>Date of incident</label>
  <input id="date" type="date">

  <label>What happened, in your own words</label>
  <textarea id="desc" rows="5" placeholder="Describe what you noticed and what you did"></textarea>

  <label>Evidence record from the Capture page (optional)</label>
  <input id="rec" type="file" accept=".json">

  <button id="gen">Generate complaint</button>
  <button id="print">Save as PDF</button>
</div>

<div id="out">Your complaint draft will appear here.</div>

<div class="help">
  <b>Where to get help in India (please verify before use):</b><br>
  Emergency: 112<br>
  Women Helpline: 1091 / 181<br>
  Cyber Crime Helpline: 1930, or report at cybercrime.gov.in<br>
  <i>This draft is not legal advice. You can also contact a lawyer or legal aid.</i>
</div>

<script>
let evidence = null;

document.getElementById('rec').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try { evidence = JSON.parse(await f.text()); }
  catch (err) { evidence = null; alert('Could not read that file. Use the evidence-record.json from the Capture page.'); }
});

document.getElementById('gen').onclick = () => {
  const place = document.getElementById('place').value.trim() || '[place of incident]';
  const date = document.getElementById('date').value || '[date]';
  const desc = document.getElementById('desc').value.trim() || '[description of what happened]';

  let ev = 'No digital evidence file was attached to this draft.';
  if (evidence) {
    ev = 'I have preserved digital evidence with these details:\n' +
      '- File: ' + evidence.file + '\n' +
      '- Captured at: ' + evidence.captured_at + '\n' +
      '- Location: ' + evidence.location + '\n' +
      '- SHA-256 fingerprint: ' + evidence.sha256 + '\n' +
      'The fingerprint can be used to check that the file has not been changed since it was captured.';
  }

  const text =
'To,\nThe Station House Officer / Cyber Crime Cell\n\n' +
'Subject: Complaint regarding a suspected privacy violation (possible hidden camera) at ' + place + '\n\n' +
'Respected Sir/Madam,\n\n' +
'I wish to report an incident that took place on ' + date + ' at ' + place + '.\n\n' +
desc + '\n\n' +
ev + '\n\n' +
'I request you to kindly register my complaint, examine the evidence, and take appropriate action as per law.\n\n' +
'Yours faithfully,\n\nName: ____________________\nContact: ____________________\nSignature: ____________________\nDate: ' + new Date().toLocaleDateString();

  document.getElementById('out').textContent = text;
};

document.getElementById('print').onclick = () => window.print();
</script>
</body>
</html>
